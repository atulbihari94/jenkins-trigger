name: Trigger Jenkins on PR Merge

on:
  push:
    branches:
      - develop
      - qa-devops

jobs:
  detect-changes:
    name: Detect Changed Folders
    runs-on: ubuntu-latest
    outputs:
      one_changed: ${{ steps.changes.outputs.one_changed }}
      two_changed: ${{ steps.changes.outputs.two_changed }}
      changed_folders: ${{ steps.changes.outputs.changed_folders }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect folder changes
        id: changes
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          ONE_CHANGED="false"
          TWO_CHANGED="false"
          CHANGED_FOLDERS=""

          if echo "$CHANGED_FILES" | grep -q "^one/"; then
            ONE_CHANGED="true"
            CHANGED_FOLDERS="one"
          fi

          if echo "$CHANGED_FILES" | grep -q "^two/"; then
            TWO_CHANGED="true"
            if [ -n "$CHANGED_FOLDERS" ]; then
              CHANGED_FOLDERS="$CHANGED_FOLDERS,two"
            else
              CHANGED_FOLDERS="two"
            fi
          fi

          echo "one_changed=$ONE_CHANGED" >> $GITHUB_OUTPUT
          echo "two_changed=$TWO_CHANGED" >> $GITHUB_OUTPUT
          echo "changed_folders=$CHANGED_FOLDERS" >> $GITHUB_OUTPUT

          echo "-----------------------------------"
          echo "Branch: ${{ github.ref_name }}"
          echo "Folder 'one' changed: $ONE_CHANGED"
          echo "Folder 'two' changed: $TWO_CHANGED"
          echo "Changed folders: $CHANGED_FOLDERS"

  trigger-jenkins:
    name: Trigger Jenkins - ${{ github.ref_name }}
    needs: detect-changes
    if: needs.detect-changes.outputs.changed_folders != ''
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins via GitHub Webhook
        run: |
          echo "========================================="
          echo "  Branch:          ${{ github.ref_name }}"
          echo "  Changed folders: ${{ needs.detect-changes.outputs.changed_folders }}"
          echo "  Commit:          ${{ github.sha }}"
          echo "  Author:          ${{ github.actor }}"
          echo "========================================="

          echo "Triggering Jenkins via /github-webhook/..."

          RESPONSE=$(curl -s -o /tmp/jenkins_response.txt -w "%{http_code}" \
            -X POST \
            "${{ secrets.JENKINS_URL }}/github-webhook/" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d '{
              "ref": "refs/heads/${{ github.ref_name }}",
              "after": "${{ github.sha }}",
              "repository": {
                "url": "${{ github.event.repository.clone_url }}",
                "html_url": "${{ github.event.repository.html_url }}",
                "full_name": "${{ github.repository }}",
                "clone_url": "${{ github.event.repository.clone_url }}"
              },
              "pusher": {
                "name": "${{ github.actor }}"
              },
              "head_commit": {
                "id": "${{ github.sha }}",
                "message": "Push to ${{ github.ref_name }}"
              }
            }')

          echo "Jenkins Response Code: $RESPONSE"

          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 201 ] || [ "$RESPONSE" -eq 204 ]; then
            echo "Jenkins triggered successfully!"
          else
            echo "ERROR: Jenkins returned HTTP $RESPONSE"
            cat /tmp/jenkins_response.txt
            exit 1
          fi

      - name: Summary
        run: |
          echo "## Jenkins Build Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Changed Folders** | \`${{ needs.detect-changes.outputs.changed_folders }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Author** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Jenkins Job** | [Open Jenkins](${{ secrets.JENKINS_URL }}/job/${{ secrets.JENKINS_JOB_NAME }}/) |" >> $GITHUB_STEP_SUMMARY

  build-folder-one:
    name: Build & Verify - folder one
    needs: detect-changes
    if: needs.detect-changes.outputs.one_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint folder one
        run: |
          echo "Linting folder 'one'..."
          pip install pyflakes
          pyflakes one/ || true

      - name: Run folder one
        run: |
          echo "Running folder 'one' app..."
          python one/app.py

  build-folder-two:
    name: Build & Verify - folder two
    needs: detect-changes
    if: needs.detect-changes.outputs.two_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint folder two
        run: |
          echo "Linting folder 'two'..."
          pip install pyflakes
          pyflakes two/ || true

      - name: Verify folder two
        run: |
          echo "Verifying folder 'two' imports..."
          python -c "from two.utils import get_timestamp, format_log; print(format_log('info', 'Build verified'))"

  skip-notification:
    name: No Changes Detected
    needs: detect-changes
    if: needs.detect-changes.outputs.changed_folders == ''
    runs-on: ubuntu-latest
    steps:
      - name: Skip notification
        run: |
          echo "No changes in monitored folders (one/, two/)."
          echo "Skipping Jenkins trigger and build."
          echo "## No Build Needed" >> $GITHUB_STEP_SUMMARY
          echo "No changes detected in project folders (\`one/\`, \`two/\`). Build skipped." >> $GITHUB_STEP_SUMMARY
