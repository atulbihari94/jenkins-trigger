name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - qa-devops

jobs:
  detect-changes:
    name: Detect Changed Folders
    runs-on: ubuntu-latest
    outputs:
      one_changed: ${{ steps.changes.outputs.one_changed }}
      two_changed: ${{ steps.changes.outputs.two_changed }}
      common_changed: ${{ steps.changes.outputs.common_changed }}
      changed_folders: ${{ steps.changes.outputs.changed_folders }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect folder changes
        id: changes
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          ONE_CHANGED="false"
          TWO_CHANGED="false"
          COMMON_CHANGED="false"
          CHANGED_FOLDERS=""

          # If common/ changed, deploy ALL products
          if echo "$CHANGED_FILES" | grep -q "^common/"; then
            COMMON_CHANGED="true"
            ONE_CHANGED="true"
            TWO_CHANGED="true"
            CHANGED_FOLDERS="one,two"
            echo ">> COMMON folder changed — all products will be built & deployed"
          else
            if echo "$CHANGED_FILES" | grep -q "^one/"; then
              ONE_CHANGED="true"
              CHANGED_FOLDERS="one"
            fi

            if echo "$CHANGED_FILES" | grep -q "^two/"; then
              TWO_CHANGED="true"
              if [ -n "$CHANGED_FOLDERS" ]; then
                CHANGED_FOLDERS="$CHANGED_FOLDERS,two"
              else
                CHANGED_FOLDERS="two"
              fi
            fi
          fi

          echo "one_changed=$ONE_CHANGED" >> $GITHUB_OUTPUT
          echo "two_changed=$TWO_CHANGED" >> $GITHUB_OUTPUT
          echo "common_changed=$COMMON_CHANGED" >> $GITHUB_OUTPUT
          echo "changed_folders=$CHANGED_FOLDERS" >> $GITHUB_OUTPUT

          echo "-----------------------------------"
          echo "Branch: ${{ github.ref_name }}"
          echo "Common changed: $COMMON_CHANGED"
          echo "Folder 'one' changed: $ONE_CHANGED"
          echo "Folder 'two' changed: $TWO_CHANGED"
          echo "Changed folders: $CHANGED_FOLDERS"

  # ──────────────────────────────────────────────
  #  BUILD & TEST (GitHub Actions handles this)
  # ──────────────────────────────────────────────

  build-folder-one:
    name: Build & Test - folder one
    needs: detect-changes
    if: needs.detect-changes.outputs.one_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyflakes
          if [ -f one/requirements.txt ]; then pip install -r one/requirements.txt; fi

      - name: Lint
        run: pyflakes one/ || true

      - name: Test
        run: python one/app.py

      - name: Build summary
        run: |
          echo "## Folder One - Build & Test Passed" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY

  build-folder-two:
    name: Build & Test - folder two
    needs: detect-changes
    if: needs.detect-changes.outputs.two_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyflakes
          if [ -f two/requirements.txt ]; then pip install -r two/requirements.txt; fi

      - name: Lint
        run: pyflakes two/ || true

      - name: Test
        run: python -c "from two.utils import get_timestamp, format_log; print(format_log('info', 'Build verified'))"

      - name: Build summary
        run: |
          echo "## Folder Two - Build & Test Passed" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────
  #  DEPLOY (trigger Jenkins - only after build passes)
  # ──────────────────────────────────────────────

  deploy-via-jenkins:
    name: Deploy via Jenkins - ${{ github.ref_name }}
    needs: [detect-changes, build-folder-one, build-folder-two]
    if: |
      always() &&
      needs.detect-changes.outputs.changed_folders != '' &&
      needs.detect-changes.result == 'success' &&
      (needs.build-folder-one.result == 'success' || needs.build-folder-one.result == 'skipped') &&
      (needs.build-folder-two.result == 'success' || needs.build-folder-two.result == 'skipped') &&
      !(needs.build-folder-one.result == 'failure' || needs.build-folder-two.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Deployment
        run: |
          echo "========================================="
          echo "  DEPLOYMENT TRIGGER"
          echo "========================================="
          echo "  Branch:          ${{ github.ref_name }}"
          echo "  Changed folders: ${{ needs.detect-changes.outputs.changed_folders }}"
          echo "  Commit:          ${{ github.sha }}"
          echo "  Author:          ${{ github.actor }}"
          echo "  Build One:       ${{ needs.build-folder-one.result }}"
          echo "  Build Two:       ${{ needs.build-folder-two.result }}"
          echo "========================================="

          echo "All builds passed. Triggering Jenkins for deployment..."

          RESPONSE=$(curl -s -o /tmp/jenkins_response.txt -w "%{http_code}" \
            -X POST \
            "${{ secrets.JENKINS_URL }}/github-webhook/" \
            -H "Content-Type: application/json" \
            -H "X-GitHub-Event: push" \
            -d '{
              "ref": "refs/heads/${{ github.ref_name }}",
              "after": "${{ github.sha }}",
              "repository": {
                "url": "${{ github.event.repository.clone_url }}",
                "html_url": "${{ github.event.repository.html_url }}",
                "full_name": "${{ github.repository }}",
                "clone_url": "${{ github.event.repository.clone_url }}"
              },
              "pusher": {
                "name": "${{ github.actor }}"
              },
              "head_commit": {
                "id": "${{ github.sha }}",
                "message": "Deploy ${{ needs.detect-changes.outputs.changed_folders }} to ${{ github.ref_name }}"
              }
            }')

          echo "Jenkins Response Code: $RESPONSE"

          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 201 ] || [ "$RESPONSE" -eq 204 ]; then
            echo "Jenkins deployment triggered successfully!"
          else
            echo "ERROR: Jenkins returned HTTP $RESPONSE"
            cat /tmp/jenkins_response.txt
            exit 1
          fi

      - name: Deployment Summary
        run: |
          echo "## Deployment Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Changed Folders** | \`${{ needs.detect-changes.outputs.changed_folders }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Author** | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Jenkins Job** | [Open Jenkins](${{ secrets.JENKINS_URL }}/job/${{ secrets.JENKINS_JOB_NAME }}/) |" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────
  #  NO CHANGES
  # ──────────────────────────────────────────────

  skip-notification:
    name: No Changes Detected
    needs: detect-changes
    if: needs.detect-changes.outputs.changed_folders == ''
    runs-on: ubuntu-latest
    steps:
      - name: Skip notification
        run: |
          echo "No changes in project folders (one/, two/). Skipping build and deploy."
          echo "## No Build Needed" >> $GITHUB_STEP_SUMMARY
          echo "No changes detected in project folders. Build and deploy skipped." >> $GITHUB_STEP_SUMMARY
