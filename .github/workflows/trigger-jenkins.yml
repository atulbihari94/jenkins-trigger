name: CI/CD Pipeline

on:
  push:
    branches:
      - develop
      - qa-devops

jobs:
  detect-changes:
    name: Detect Changed Products
    runs-on: ubuntu-latest
    outputs:
      one_changed: ${{ steps.changes.outputs.one_changed }}
      tim_changed: ${{ steps.changes.outputs.tim_changed }}
      timplus_changed: ${{ steps.changes.outputs.timplus_changed }}
      flo_changed: ${{ steps.changes.outputs.flo_changed }}
      common_changed: ${{ steps.changes.outputs.common_changed }}
      sdk_changed: ${{ steps.changes.outputs.sdk_changed }}
      changed_products: ${{ steps.changes.outputs.changed_products }}
      deploy_all: ${{ steps.changes.outputs.deploy_all }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: changes
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          ONE="false"; TIM="false"; TIMPLUS="false"; FLO="false"
          COMMON="false"; SDK="false"; DEPLOY_ALL="false"
          PRODUCTS=""

          # Check shared folders first
          if echo "$CHANGED_FILES" | grep -q "^common/"; then
            COMMON="true"; DEPLOY_ALL="true"
          fi
          if echo "$CHANGED_FILES" | grep -q "^sdk/"; then
            SDK="true"; DEPLOY_ALL="true"
          fi

          if [ "$DEPLOY_ALL" = "true" ]; then
            ONE="true"; TIM="true"; TIMPLUS="true"; FLO="true"
            PRODUCTS="ONE,TIM,TIM+,FLO"
            echo ">> SHARED CODE (common/ or sdk/) changed — ALL products will be built & deployed"
          else
            if echo "$CHANGED_FILES" | grep -q "^products/ONE/"; then
              ONE="true"
              PRODUCTS="ONE"
            fi
            if echo "$CHANGED_FILES" | grep -q "^products/TIM/"; then
              TIM="true"
              [ -n "$PRODUCTS" ] && PRODUCTS="$PRODUCTS,TIM" || PRODUCTS="TIM"
            fi
            if echo "$CHANGED_FILES" | grep -q "^products/TIM+/"; then
              TIMPLUS="true"
              [ -n "$PRODUCTS" ] && PRODUCTS="$PRODUCTS,TIM+" || PRODUCTS="TIM+"
            fi
            if echo "$CHANGED_FILES" | grep -q "^products/FLO/"; then
              FLO="true"
              [ -n "$PRODUCTS" ] && PRODUCTS="$PRODUCTS,FLO" || PRODUCTS="FLO"
            fi
          fi

          echo "one_changed=$ONE" >> $GITHUB_OUTPUT
          echo "tim_changed=$TIM" >> $GITHUB_OUTPUT
          echo "timplus_changed=$TIMPLUS" >> $GITHUB_OUTPUT
          echo "flo_changed=$FLO" >> $GITHUB_OUTPUT
          echo "common_changed=$COMMON" >> $GITHUB_OUTPUT
          echo "sdk_changed=$SDK" >> $GITHUB_OUTPUT
          echo "changed_products=$PRODUCTS" >> $GITHUB_OUTPUT
          echo "deploy_all=$DEPLOY_ALL" >> $GITHUB_OUTPUT

          echo "-----------------------------------"
          echo "Branch:           ${{ github.ref_name }}"
          echo "Common changed:   $COMMON"
          echo "SDK changed:      $SDK"
          echo "Deploy all:       $DEPLOY_ALL"
          echo "Products:         $PRODUCTS"

  # ──────────────────────────────────────────────
  #  BUILD & TEST per product (GitHub Actions)
  # ──────────────────────────────────────────────

  build-ONE:
    name: "Build: ONE (FSO)"
    needs: detect-changes
    if: needs.detect-changes.outputs.one_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & Test ONE
        run: |
          echo "Building product ONE (FSO)..."
          echo "Reason: ${{ needs.detect-changes.outputs.deploy_all == 'true' && 'shared code changed' || 'products/ONE/ changed' }}"
          ls -la products/ONE/app/
          echo "ONE build passed!"

  build-TIM:
    name: "Build: TIM"
    needs: detect-changes
    if: needs.detect-changes.outputs.tim_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & Test TIM
        run: |
          echo "Building product TIM..."
          echo "Reason: ${{ needs.detect-changes.outputs.deploy_all == 'true' && 'shared code changed' || 'products/TIM/ changed' }}"
          ls -la products/TIM/app/
          echo "TIM build passed!"

  build-TIMPLUS:
    name: "Build: TIM+"
    needs: detect-changes
    if: needs.detect-changes.outputs.timplus_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & Test TIM+
        run: |
          echo "Building product TIM+..."
          echo "Reason: ${{ needs.detect-changes.outputs.deploy_all == 'true' && 'shared code changed' || 'products/TIM+/ changed' }}"
          ls -la "products/TIM+/app/"
          echo "TIM+ build passed!"

  build-FLO:
    name: "Build: FLO"
    needs: detect-changes
    if: needs.detect-changes.outputs.flo_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build & Test FLO
        run: |
          echo "Building product FLO..."
          echo "Reason: ${{ needs.detect-changes.outputs.deploy_all == 'true' && 'shared code changed' || 'products/FLO/ changed' }}"
          ls -la products/FLO/app/
          echo "FLO build passed!"

  # ──────────────────────────────────────────────
  #  DEPLOY via Jenkins (only after builds pass)
  # ──────────────────────────────────────────────

  deploy-via-jenkins:
    name: "Deploy via Jenkins - ${{ github.ref_name }}"
    needs: [detect-changes, build-ONE, build-TIM, build-TIMPLUS, build-FLO]
    if: |
      always() &&
      needs.detect-changes.outputs.changed_products != '' &&
      needs.detect-changes.result == 'success' &&
      !(needs.build-ONE.result == 'failure' || needs.build-TIM.result == 'failure' || needs.build-TIMPLUS.result == 'failure' || needs.build-FLO.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Deployment
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
        run: |
          echo "========================================="
          echo "  ALL BUILDS PASSED — TRIGGERING DEPLOY"
          echo "========================================="
          echo "  Branch:    ${{ github.ref_name }}"
          echo "  Products:  ${{ needs.detect-changes.outputs.changed_products }}"
          echo "  Commit:    ${{ github.sha }}"
          echo "  Author:    ${{ github.actor }}"
          echo "========================================="

          JOB_NAME="event-bridge-monorepo-test-only"
          BRANCH="${{ github.ref_name }}"

          # Get Jenkins crumb for CSRF protection
          echo "Getting Jenkins CRUMB..."
          CRUMB=$(curl -s -u "$JENKINS_USER:$JENKINS_TOKEN" \
            "$JENKINS_URL/crumbIssuer/api/json" | jq -r '.crumb // empty')

          if [ -z "$CRUMB" ]; then
            echo "Warning: Could not get CRUMB, trying without it..."
            CRUMB_HEADER=""
          else
            echo "Got CRUMB successfully"
            CRUMB_HEADER="-H Jenkins-Crumb:$CRUMB"
          fi

          # Method 1: Trigger Multibranch Pipeline scan (picks up new commits)
          echo ""
          echo "Triggering Multibranch Pipeline scan..."
          SCAN_RESPONSE=$(curl -s -o /tmp/jenkins_scan.txt -w "%{http_code}" \
            -X POST \
            -u "$JENKINS_USER:$JENKINS_TOKEN" \
            $CRUMB_HEADER \
            "$JENKINS_URL/job/$JOB_NAME/scan")

          echo "Scan Response: $SCAN_RESPONSE"

          # Method 2: Directly trigger the branch build
          echo ""
          echo "Triggering branch build directly..."
          BUILD_RESPONSE=$(curl -s -o /tmp/jenkins_build.txt -w "%{http_code}" \
            -X POST \
            -u "$JENKINS_USER:$JENKINS_TOKEN" \
            $CRUMB_HEADER \
            "$JENKINS_URL/job/$JOB_NAME/job/$BRANCH/build")

          echo "Build Response: $BUILD_RESPONSE"

          # Check results
          if [ "$SCAN_RESPONSE" -eq 200 ] || [ "$SCAN_RESPONSE" -eq 201 ] || [ "$SCAN_RESPONSE" -eq 302 ] || \
             [ "$BUILD_RESPONSE" -eq 200 ] || [ "$BUILD_RESPONSE" -eq 201 ] || [ "$BUILD_RESPONSE" -eq 302 ]; then
            echo ""
            echo "Jenkins deployment triggered successfully!"
          else
            echo ""
            echo "ERROR: Jenkins trigger failed"
            echo "Scan response body:"
            cat /tmp/jenkins_scan.txt 2>/dev/null | head -5
            echo ""
            echo "Build response body:"
            cat /tmp/jenkins_build.txt 2>/dev/null | head -5
            exit 1
          fi

      - name: Summary
        run: |
          echo "## Deployment Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Products** | \`${{ needs.detect-changes.outputs.changed_products }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Common changed** | ${{ needs.detect-changes.outputs.common_changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **SDK changed** | ${{ needs.detect-changes.outputs.sdk_changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────────
  #  NO CHANGES
  # ──────────────────────────────────────────────

  skip-notification:
    name: No Product Changes
    needs: detect-changes
    if: needs.detect-changes.outputs.changed_products == ''
    runs-on: ubuntu-latest
    steps:
      - name: Skip
        run: |
          echo "No changes in product folders or shared code. Skipping."
          echo "## No Build Needed" >> $GITHUB_STEP_SUMMARY
