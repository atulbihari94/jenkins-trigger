# ─────────────────────────────────────────────────────────────────
# CI/CD Pipeline — STM32 Firmware Monorepo
# ─────────────────────────────────────────────────────────────────
#
# Triggered ONLY on PR merge to develop or qa-devops.
# Products are auto-discovered from the PRODUCTS_DIR folder.
#
# Flow:
#   1. detect-changes  → finds which product folders have changes
#   2. build           → builds/tests only changed products (dynamic matrix)
#   3. deploy          → triggers Jenkins if product changes exist
#   4. manual-notice   → notifies if only non-product files changed
#
# To rename the products folder, update PRODUCTS_DIR below.
# To add a new product, just create a folder under products/.
# ─────────────────────────────────────────────────────────────────

name: CI/CD Pipeline

on:
  pull_request:
    types: [closed]
    branches:
      - develop
      - qa-devops

env:
  PRODUCTS_DIR: products

jobs:

  # ── 1. DETECT which product folders changed ────────────────────

  detect-changes:
    name: Detect Changed Products
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    outputs:
      changed_products: ${{ steps.detect.outputs.changed_products }}
      has_product_changes: ${{ steps.detect.outputs.has_product_changes }}
      non_product_only: ${{ steps.detect.outputs.non_product_only }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changes
        id: detect
        run: |
          CHANGED_FILES=$(git diff --name-only HEAD~1 HEAD)
          echo "Changed files:"
          echo "$CHANGED_FILES"

          ALL_PRODUCTS=""
          if [ -d "$PRODUCTS_DIR" ]; then
            ALL_PRODUCTS=$(ls -d $PRODUCTS_DIR/*/ 2>/dev/null | while read d; do basename "$d"; done | sort)
          fi

          CHANGED_PRODUCTS=""
          for product in $ALL_PRODUCTS; do
            if echo "$CHANGED_FILES" | grep -q "^${PRODUCTS_DIR}/${product}/"; then
              [ -n "$CHANGED_PRODUCTS" ] && CHANGED_PRODUCTS="$CHANGED_PRODUCTS,$product" || CHANGED_PRODUCTS="$product"
            fi
          done

          HAS_PRODUCT_CHANGES="false"
          NON_PRODUCT_ONLY="false"
          [ -n "$CHANGED_PRODUCTS" ] && HAS_PRODUCT_CHANGES="true"

          HAS_NON_PRODUCT=$(echo "$CHANGED_FILES" | grep -v "^${PRODUCTS_DIR}/" | head -1)
          [ -n "$HAS_NON_PRODUCT" ] && [ "$HAS_PRODUCT_CHANGES" = "false" ] && NON_PRODUCT_ONLY="true"

          if [ -n "$CHANGED_PRODUCTS" ]; then
            PRODUCTS_JSON=$(echo "$CHANGED_PRODUCTS" | tr ',' '\n' | jq -R . | jq -s -c .)
          else
            PRODUCTS_JSON='[]'
          fi

          echo "changed_products=$PRODUCTS_JSON" >> $GITHUB_OUTPUT
          echo "has_product_changes=$HAS_PRODUCT_CHANGES" >> $GITHUB_OUTPUT
          echo "non_product_only=$NON_PRODUCT_ONLY" >> $GITHUB_OUTPUT

          echo "---"
          echo "Branch:              ${{ github.event.pull_request.base.ref }}"
          echo "Has product changes: $HAS_PRODUCT_CHANGES"
          echo "Non-product only:    $NON_PRODUCT_ONLY"
          echo "Changed products:    $CHANGED_PRODUCTS"

  # ── 2. BUILD & TEST changed products (dynamic matrix) ─────────

  build:
    name: "Build: ${{ matrix.product }}"
    needs: detect-changes
    if: needs.detect-changes.outputs.has_product_changes == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJson(needs.detect-changes.outputs.changed_products) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build & Test ${{ matrix.product }}
        run: |
          echo "Building: ${{ matrix.product }}"
          # TODO: Replace with actual firmware build commands once Dockerfile is ready
          ls -la "${{ env.PRODUCTS_DIR }}/${{ matrix.product }}/"
          echo "${{ matrix.product }} build passed!"

  # ── 3. AUTO DEPLOY via Jenkins (product changes only) ──────────

  deploy-via-jenkins:
    name: "Deploy via Jenkins"
    needs: [detect-changes, build]
    if: |
      always() &&
      needs.detect-changes.outputs.has_product_changes == 'true' &&
      needs.detect-changes.result == 'success' &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_TOKEN }}
        run: |
          JOB_NAME="event-bridge-monorepo-test-only"
          BRANCH="${{ github.event.pull_request.base.ref }}"

          echo "Triggering Jenkins: $JOB_NAME/$BRANCH"

          CRUMB=$(curl -s -u "$JENKINS_USER:$JENKINS_TOKEN" \
            "$JENKINS_URL/crumbIssuer/api/json" | jq -r '.crumb // empty')

          CRUMB_HEADER=""
          [ -n "$CRUMB" ] && CRUMB_HEADER="-H Jenkins-Crumb:$CRUMB"

          RESPONSE=$(curl -s -o /tmp/jenkins.txt -w "%{http_code}" \
            -X POST -u "$JENKINS_USER:$JENKINS_TOKEN" $CRUMB_HEADER \
            "$JENKINS_URL/job/$JOB_NAME/job/$BRANCH/build")

          if [ "$RESPONSE" -eq 200 ] || [ "$RESPONSE" -eq 201 ] || [ "$RESPONSE" -eq 302 ]; then
            echo "Jenkins triggered successfully!"
          else
            echo "ERROR: Jenkins trigger failed (HTTP $RESPONSE)"
            cat /tmp/jenkins.txt 2>/dev/null | head -5
            exit 1
          fi

      - name: Summary
        run: |
          echo "## Deployment Triggered" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch** | \`${{ github.event.pull_request.base.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Products** | \`${{ needs.detect-changes.outputs.changed_products }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY

  # ── 4. NON-PRODUCT CHANGES — manual deploy from Jenkins UI ────

  manual-deploy-notice:
    name: Manual Deploy Required
    needs: detect-changes
    if: needs.detect-changes.outputs.non_product_only == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Only non-product files changed. Deploy manually from Jenkins UI."
          echo "## Manual Deploy Required" >> $GITHUB_STEP_SUMMARY
          echo "Only non-product files were changed. No automatic deployment." >> $GITHUB_STEP_SUMMARY
          echo "To deploy, trigger the Jenkins job manually." >> $GITHUB_STEP_SUMMARY

  # ── 5. NO RELEVANT CHANGES ────────────────────────────────────

  skip-notification:
    name: No Changes
    needs: detect-changes
    if: |
      needs.detect-changes.outputs.has_product_changes != 'true' &&
      needs.detect-changes.outputs.non_product_only != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "No relevant changes detected."
          echo "## No Build Needed" >> $GITHUB_STEP_SUMMARY
